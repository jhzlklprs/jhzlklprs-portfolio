<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Page Not Found</title>

  <meta
    name="description"
    content="The page you're looking for doesn't exist or has been moved.">

  <meta name="robots" content="noindex">

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="assets/images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="assets/css/style.css">

  <!-- Apply saved theme silently (no toggle UI on this page) -->
  <script>
    (function () {
      var saved = localStorage.getItem('portfolio-theme');
      document.documentElement.setAttribute(
        'data-theme',
        (saved === 'light' || saved === 'dark' || saved === 'system')
          ? saved
          : 'light'
      );
    })();
  </script>

</head>


<body>


  <!-- =========================================================
       STATE PAGE — 404 NOT FOUND
  ========================================================= -->

  <div class="state-page reveal">


    <!-- =====================================================
         ILLUSTRATION
    ===================================================== -->

    <div class="state-illustration">

      <svg
        viewBox="0 0 240 160"
        xmlns="http://www.w3.org/2000/svg">

        <rect
          x="0.5"
          y="0.5"
          width="239"
          height="159"
          rx="10"
          fill="var(--surface)"
          stroke="var(--border)" />

        <circle cx="20" cy="20" r="3" fill="var(--border)" />
        <circle cx="32" cy="20" r="3" fill="var(--border)" />
        <circle cx="44" cy="20" r="3" fill="var(--border)" />

        <line
          x1="0.5"
          y1="34"
          x2="239.5"
          y2="34"
          stroke="var(--border)" />

        <text
          x="112"
          y="112"
          text-anchor="middle"
          font-family="Inter, sans-serif"
          font-weight="800"
          font-size="48"
          fill="var(--border)">

          404

        </text>

        <!-- magnifying glass -->
        <g
          transform="translate(158,90)"
          fill="none"
          stroke="var(--accent)"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round">

          <circle cx="0" cy="0" r="15" />
          <line x1="11" y1="11" x2="22" y2="22" />

        </g>

      </svg>

    </div>


    <!-- =====================================================
         COPY
    ===================================================== -->

    <p class="state-label">
      404 · Page Not Found
    </p>

    <h1>
      This page doesn't exist.
    </h1>

    <p class="state-text">
      The page you're looking for may have been moved, renamed,
      or never existed in the first place.
    </p>

    <div class="state-actions">

      <a
        class="btn-home"
        href="index.html">

        Back to Homepage

      </a>

    </div>

  </div>


</body>

</html>
